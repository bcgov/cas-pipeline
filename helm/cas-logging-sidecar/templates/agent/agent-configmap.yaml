{{- $gatewayServiceName := .Values.collector.gatewayServiceOverride | default "{{ .Release.Name }}-vector-gateway" }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-vector-collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: Agent
    app.kubernetes.io/instance: vector
    app.kubernetes.io/name: vector
    app.kubernetes.io/version: 0.26.0-distroless-libc
data:
  vector.yaml: |
    data_dir: "/tmp/vector"

    sources:
      app_logs:
        type: "file"
        include:
          - "/var/log/app/app.log"
          - "/var/log/app/app.log-*"
        read_from: "beginning"

        multiline:
          timeout_ms: 1000
          mode: continue_through
          start_pattern: '^[^\s]'
          condition_pattern: '^(in|\s{1,3}|Read more:)\s'

    transforms:
      add_app_metadata:
        type: "remap"
        inputs: ["app_logs"]
        source: |
          .app_name = get_env_var!("APP_NAME")
          .tag = {{ .Values.tag | quote }}
          .@timestamp = parse_timestamp(.timestamp ?? now(), "%Y-%m-%dT%H:%M:%SZ")

    sinks:
      to_aggregator:
        type: "vector"
        inputs: ["add_app_metadata"]
        routing:
          endpoints:
            - "{{ $gatewayServiceName }}.{{ .Release.Namespace }}.svc.cluster.local:6000"
        acknowledgements:
          enabled: true
  logrotate.conf: |
    /var/log/app/app.log {
        size 25M
        missingok
        notifempty
        copytruncate
        rotate 5
        compress
        delaycompress
    }
