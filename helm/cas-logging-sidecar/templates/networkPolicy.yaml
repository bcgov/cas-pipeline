kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-vector-gateway-ingress
  labels:
    app.kubernetes.io/component: logging-aggregator
    {{- include "cas-logging-sidecar.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
        app.kubernetes.io/name: {{ .Values.vector.nameOverride }}
  ingress:
    - from:
        - podSelector: {} # Allow all from Gateway's namespace
      ports:
        - protocol: TCP
          port: 6000
