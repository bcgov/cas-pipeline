kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-makeitso-deployer
  labels:
{{ include "cas-provision.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-makeitso-deployer
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-makeitso-deployer
    namespace: {{ .Values.makeitsoDeployer.namespace }}
